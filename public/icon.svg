<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990026"/>
      <stop offset="100%" stop-color="#600018"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Stylized Open Book & Brain/Sparkle Symbol -->
  <g filter="url(#shadow)" transform="translate(96, 106) scale(0.625)">
    <!-- Book Spine & Pages -->
    <path d="M256 120 C180 60 80 70 20 90 L20 400 C80 380 180 370 256 420 C332 370 432 380 492 400 L492 90 C432 70 332 60 256 120 Z" fill="#FFFDFB" opacity="0.95"/>
    <path d="M256 120 L256 420" stroke="#800020" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Accent Lines representing study notes -->
    <line x1="70" y1="160" x2="200" y2="150" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <line x1="70" y1="210" x2="190" y2="200" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <line x1="70" y1="260" x2="210" y2="250" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <line x1="70" y1="310" x2="180" y2="300" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

    <line x1="312" y1="150" x2="442" y2="160" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <line x1="322" y1="200" x2="442" y2="210" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <line x1="302" y1="250" x2="442" y2="260" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <line x1="332" y1="300" x2="442" y2="310" stroke="#800020" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

    <!-- Central Floating AI Sparkle in Goldenrod -->
    <path d="M256 20 L268 70 L318 82 L268 94 L256 144 L244 94 L194 82 L244 70 Z" fill="#FBBF24"/>
    <circle cx="256" cy="82" r="6" fill="#FFF"/>
  </g>
</svg>
